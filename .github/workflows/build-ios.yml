name: Build & Sign iOS IPA
# 触发方式：推送 main 分支，或网页手动点击 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      two_fa:
        description: 'Apple ID 双重验证码（6位，Apple 要求时填写）'
        required: false
        default: ''

jobs:
  # ============ 第一步：编译 SwiftUI 项目，产出未签名 IPA ============
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      - name: 安装 xcodegen（生成 Xcode 项目）
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: |
          cd LiquidGlassApp
          xcodegen generate

      - name: 编译未签名 App（CODE_SIGNING_ALLOWED=NO 关闭签名）
        run: |
          cd LiquidGlassApp
          xcodebuild \
            -project LiquidGlassApp.xcodeproj \
            -scheme LiquidGlassApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 手动打包为未签名 IPA
        run: |
          cd LiquidGlassApp
          mkdir -p build/Payload
          cp -R "build/Build/Products/Release-iphoneos/LiquidGlassApp.app" build/Payload/
          cd build
          zip -r LiquidGlassApp.ipa Payload

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: LiquidGlassApp/build/LiquidGlassApp.ipa

  # ============ 第二步：用免费 Apple ID 证书自动签名 ============
  # 需要先配置 GitHub Secrets：APPLE_ID / APPLE_PASSWORD / DEVICE_UDID
  # 未配置时此步骤自动跳过（只出未签名 IPA）
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检查是否配置了 Apple ID
        id: check
        if: secrets.APPLE_ID != ''
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 下载未签名 IPA
        if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: unsigned

      - name: 安装签名工具依赖
        if: steps.check.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config unzip
          python3 -m pip install --upgrade pip
          git clone --depth 1 https://github.com/test1ng-guy/iOS-sandbox-explorer.git signer
          python3 -m pip install -r signer/tools/requirements.txt

      - name: 编译安装 zsign（重签名工具，原理同全能签）
        if: steps.check.outputs.ok == 'true'
        run: |
          git clone --depth 1 https://github.com/zhlynn/zsign.git
          cd zsign
          cmake .
          make -j2
          sudo cp zsign /usr/local/bin/
          zsign --help | head -3 || true

      - name: Apple ID 认证并签名（SRP 协议，密码不落盘）
        if: steps.check.outputs.ok == 'true'
        run: |
          {
            echo "${{ secrets.APPLE_ID }}"
            echo "${{ secrets.APPLE_PASSWORD }}"
            echo "${{ inputs.two_fa }}"
          } | python3 signer/tools/apple_account.py sign \
            --ipa "unsigned/LiquidGlassApp.ipa" \
            -o "LiquidGlassApp_signed.ipa" \
            --udid "${{ secrets.DEVICE_UDID }}" \
            --bundle-id "com.example.liquidglass"

      - name: 上传已签名 IPA
        if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: LiquidGlassApp_signed.ipa
