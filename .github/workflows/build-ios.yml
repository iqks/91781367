name: Build iOS unsigned IPA
# 触发方式：推送 main 分支，或网页手动点击 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      - name: 安装 xcodegen（生成 Xcode 项目）
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: |
          cd LiquidGlassApp
          xcodegen generate

      - name: 编译未签名 App（CODE_SIGNING_ALLOWED=NO 关闭签名）
        run: |
          cd LiquidGlassApp
          xcodebuild \
            -project LiquidGlassApp.xcodeproj \
            -scheme LiquidGlassApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 手动打包为未签名 IPA（供全能签签名）
        run: |
          cd LiquidGlassApp
          mkdir -p build/Payload
          cp -R "build/Build/Products/Release-iphoneos/LiquidGlassApp.app" build/Payload/
          cd build
          zip -r LiquidGlassApp.ipa Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: LiquidGlassApp/build/LiquidGlassApp.ipa
