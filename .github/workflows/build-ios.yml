name: Build & Sign iOS IPA
# 触发方式：推送 main 分支，或网页手动点击 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      two_fa:
        description: 'Apple ID 双重验证码（6位，Apple 要求时填写）'
        required: false
        default: ''

jobs:
  # ============ 第一步：编译 SwiftUI 项目，产出未签名 IPA ============
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      - name: 安装 xcodegen（生成 Xcode 项目）
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: |
          cd LiquidGlassApp
          xcodegen generate

      - name: 编译未签名 App（关闭签名）
        run: |
          cd LiquidGlassApp
          set -o pipefail
          xcodebuild \
            -project LiquidGlassApp.xcodeproj \
            -scheme LiquidGlassApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build.log | tail -200

      - name: 上传编译日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: /tmp/build.log

      - name: 手动打包为未签名 IPA
        run: |
          cd LiquidGlassApp
          mkdir -p build/Payload
          cp -R "build/Build/Products/Release-iphoneos/LiquidGlassApp.app" build/Payload/
          cd build
          zip -r LiquidGlassApp.ipa Payload

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: LiquidGlassApp/build/LiquidGlassApp.ipa

  # ============ 第二步：用免费 Apple ID 证书自动签名 ============
  # 需要先在 GitHub Secrets 配置：APPLE_ID / APPLE_PASSWORD / DEVICE_UDID
  # 未配置时脚本自动跳过（只出未签名 IPA）
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
      TWO_FA: ${{ inputs.two_fa }}
    steps:
      - name: 下载未签名 IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: unsigned

      - name: 安装签名工具依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config unzip
          python3 -m pip install --upgrade pip
          git clone --depth 1 https://github.com/test1ng-guy/iOS-sandbox-explorer.git signer
          python3 -m pip install -r signer/tools/requirements.txt

      - name: 下载 zsign 预编译版（重签名工具，原理同全能签）
        run: |
          curl -sL -o zsign.tar.gz https://github.com/zhlynn/zsign/releases/download/v1.1.2/zsign-linux-x86_64.tar.gz
          tar -xzf zsign.tar.gz
          ls -la
          find . -name "zsign*" -type f | head -5
          sudo cp zsign /usr/local/bin/ 2>/dev/null || sudo cp $(find . -name "zsign" -type f | head -1) /usr/local/bin/
          zsign --help 2>&1 | head -3 || echo "zsign 就绪"

      - name: Apple ID 认证并签名（未配置则自动跳过）
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "未配置 APPLE_ID，跳过签名步骤（已产出未签名 IPA）"
            exit 0
          fi
          {
            echo "$APPLE_ID"
            echo "$APPLE_PASSWORD"
            echo "$TWO_FA"
          } | python3 signer/tools/apple_account.py sign \
            --ipa "unsigned/LiquidGlassApp.ipa" \
            -o "LiquidGlassApp_signed.ipa" \
            --udid "$DEVICE_UDID" \
            --bundle-id "com.example.liquidglass"
          ls -la LiquidGlassApp_signed.ipa

      - name: 上传已签名 IPA
        if: env.APPLE_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: LiquidGlassApp_signed.ipa
