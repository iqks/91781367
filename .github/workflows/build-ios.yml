name: Build iOS unsigned IPA
# 触发方式：推送 main 分支，或网页手动点击 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'   # 与本地 Flutter 版本保持一致
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # flutter build ipa --no-codesign 会跳过 IPA 生成（只出 xcarchive），
      # 所以改用 flutter build ios 生成 .app，再手动打包成未签名 IPA
      - name: 编译未签名 App
        run: flutter build ios --release --no-codesign

      - name: 手动打包为未签名 IPA（供全能签签名）
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          mkdir -p ../ipa
          zip -r ../ipa/liquid_glass_app.ipa Payload
          cd ../../..

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
