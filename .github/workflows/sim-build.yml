name: Build iOS Simulator App
# 模拟器版编译：push 到 main 自动跑，产物是 LiquidGlassApp.app（zip），免登录下载
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-sim:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 编译 OpenSSL（iOS 模拟器 x86_64，原生签名引擎依赖）
        run: |
          WORK="$GITHUB_WORKSPACE/LiquidGlassApp/LiquidGlassApp/NativeSign"
          mkdir -p "$WORK/thirdparty/lib" "$WORK/thirdparty/include"
          mkdir -p /tmp/osl && cd /tmp/osl
          curl -sL --retry 5 -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz
          tar -xzf openssl.tar.gz
          cd openssl-OpenSSL_1_1_1w
          set -o pipefail
          # 1.1.1w 没有 ios-sim-cross 目标；用 darwin64 目标 + 指定 iphonesimulator SDK 的 sysroot 编译，
          # 这样编出的 libcrypto.a 平台标记就是 iOS-simulator，能被模拟器版链接
          IOS_SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ./Configure darwin64-x86_64-cc no-shared no-asm no-engine no-dso no-tests \
            CC="clang -isysroot $IOS_SIM_SDK -mios-simulator-version-min=15.0 -arch x86_64" \
            --prefix="$(pwd)/out" 2>&1 | tee /tmp/osl_sim.log | tail -40
          make -j4 2>&1 | tee -a /tmp/osl_sim.log | tail -40
          file libcrypto.a | head -2
          ls -la libcrypto.a
          cp libcrypto.a "$WORK/thirdparty/lib/"
          cp -R include/openssl "$WORK/thirdparty/include/"
          echo "OpenSSL(sim) OK"

      - name: 生成 Xcode 项目
        run: |
          cd LiquidGlassApp
          xcodegen generate

      - name: 编译模拟器版（关闭签名）
        run: |
          cd LiquidGlassApp
          set -o pipefail
          xcodebuild \
            -project LiquidGlassApp.xcodeproj \
            -scheme LiquidGlassApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/sim_build.log | tail -200

      - name: 编译失败自动记录错误日志
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'no build.log';
            if (fs.existsSync('/tmp/sim_build.log')) {
              log = fs.readFileSync('/tmp/sim_build.log', 'utf8').split('\n').slice(-500).join('\n');
            }
            const content = Buffer.from(log).toString('base64');
            async function write(sha, path, msg, c) {
              const p = { owner: context.repo.owner, repo: context.repo.repo, path: path, message: msg, content: c };
              if (sha) p.sha = sha;
              await github.rest.repos.createOrUpdateFileContents(p);
            }
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'errors/sim_latest.log' });
              await write(existing.data.sha, 'errors/sim_latest.log', '记录模拟器编译错误 [skip ci]', content);
            } catch (e) {
              await write(undefined, 'errors/sim_latest.log', '记录模拟器编译错误 [skip ci]', content);
            }
            // OpenSSL 编译日志也记录（定位 Configure/make 失败原因）
            let osl = 'empty';
            if (fs.existsSync('/tmp/osl_sim.log')) {
              osl = fs.readFileSync('/tmp/osl_sim.log', 'utf8').split('\n').slice(-800).join('\n');
            }
            const oslContent = Buffer.from(osl).toString('base64');
            try {
              const existingOsl = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'errors/sim_openssl.log' });
              await write(existingOsl.data.sha, 'errors/sim_openssl.log', '记录模拟器 OpenSSL 编译日志 [skip ci]', oslContent);
            } catch (e) {
              await write(undefined, 'errors/sim_openssl.log', '记录模拟器 OpenSSL 编译日志 [skip ci]', oslContent);
            }

      - name: 打包模拟器 App
        run: |
          cd LiquidGlassApp/build/Build/Products/Release-iphonesimulator
          zip -r LiquidGlassApp_sim.zip LiquidGlassApp.app

      - name: 上传模拟器包
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: LiquidGlassApp/build/Build/Products/Release-iphonesimulator/LiquidGlassApp_sim.zip

      - name: 发布到 Releases（免登录下载）
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'sim-' + Date.now();
            const rel = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, name: '签名助手模拟器版 ' + tag,
              body: '模拟器版（免登录下载）：解压 zip，把 LiquidGlassApp.app 拖进 iOS 模拟器即可运行'
            });
            const f = 'LiquidGlassApp/build/Build/Products/Release-iphonesimulator/LiquidGlassApp_sim.zip';
            if (fs.existsSync(f)) {
              const buf = fs.readFileSync(f);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: rel.data.id, name: 'LiquidGlassApp_sim.zip', data: buf
              });
              console.log('已上传模拟器包');
            } else {
              console.log('缺少文件: ' + f);
            }
