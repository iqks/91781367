name: LiquidGlassApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  LiquidGlassApp:
    type: application
    platform: iOS
    sources:
      - path: LiquidGlassApp
        excludes:
          - "NativeSign/thirdparty"
    info:
      path: LiquidGlassApp/Info.plist
      properties:
        CFBundleDisplayName: 签名助手
        CFBundleURLTypes:
          - CFBundleURLName: signhelper
            CFBundleURLSchemes: [signhelper]
        # 像 QQ 一样：其他应用分享/打开 IPA 时，可以选择「签名助手」接收
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA 应用包
            LSItemContentTypes:
              - com.signhelper.ipa
              - public.zip-archive
              - public.data
            CFBundleTypeRole: Editor
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.signhelper.ipa
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeDescription: IPA 应用包
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: App 需要访问本地网络，以连接你电脑上的内容后台
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.liquidglass
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/LiquidGlassApp/NativeSign/BridgingHeader.h"
        CLANG_CXX_LANGUAGE_STANDARD: "c++11"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/LiquidGlassApp/NativeSign/zsign/src"
          - "$(SRCROOT)/LiquidGlassApp/NativeSign/zsign/src/common"
          - "$(SRCROOT)/LiquidGlassApp/NativeSign/zsign/src/third-party/zlib"
          - "$(SRCROOT)/LiquidGlassApp/NativeSign/thirdparty/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/LiquidGlassApp/NativeSign/thirdparty/lib"
        OTHER_LDFLAGS:
          - "-lcrypto"
